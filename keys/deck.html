  .side { border-top: 3px solid var(--ink); padding-top: 26px; display: grid; grid-template-rows: auto auto auto 1fr; }

  /* Journey as stage bars */
  .stages { display: grid; grid-template-columns: 300px 1fr; column-gap: 40px; row-gap: 26px; align-items: start; }

<script>
  const K = JSON.parse(document.getElementById('keys').textContent);

  // Formatting. Whole rupees; lakh/crore with at most two decimals; percentages with at most one.
  const num = n => Math.round(n).toLocaleString('en-IN');
  const inr = n => '₹' + num(Math.abs(n));
  const L = n => Math.abs(n) >= 1e7 ? '₹' + (n / 1e7).toFixed(2) + ' Cr' : '₹' + (n / 1e5).toFixed(1) + ' L';
  const pct = (n, d = 1) => n.toFixed(d) + '%';
  const delta = (a, b) => { const d = 100 * (a - b) / b; return (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(0) + '%'; };
  const up = (a, b) => Math.abs(100 * (a - b) / b).toFixed(0) + '%';
  const pp = (a, b) => { const d = a - b; return (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' pt'; };

  // Derived, presentation only
  const j1_other_new = K.j1_new_all_customers - K.j1_new_paid_customers - K.j1_new_people_marketplace;

  const j2_bots = j2_all - K.j2_sessions_eligible;
  const j2_paid = K.j2_sessions_eligible * K.j2_paid_session_share / 100;
  const j2_orders = K.j2_sessions_eligible * K.j2_cvr_eligible / 100;

  const j4_rto_side = K.j4_revfee_rto + K.j4_rto_fwd_cost + K.j4_rto_cod_fee + K.j4_mkt_rto_fee;
  const j4_n_all = K.j4_n_customer_return + K.j4_n_marketplace_return + K.j4_n_exchange + K.j4_n_rto;

              ${segs.filter(s => s[1] > 0).map(s => `<i class="${s[2]}" style="flex:${s[1]} 0 0"></i>`).join('')}
            </div>
            <div class="legend">${segs.map(s => `<span class="${s[2]}">${s[0]} <b>${fmtSeg(s[1], money)}</b></span>`).join('')}</div></div>`;
        }).join('')}
      </div></div>
      ${step('Step 2 · Journey and states')}<span class="pg"></span></section>`);

    // 4. forks with consequences
    const F = p.forks;
    add(`<section class="slide">${mark(p)}
      <h2>${F.title}<small>Each option shows the number it produces. Bold is our choice.</small></h2>
      <div class="body"><div class="forks">
        ${F.rows.map((r, i) => `<div class="fork"><span class="n">0${i + 1}</span><span class="k">${r[0]}</span>
          <span class="opts">${r[1].map((o, k) => `<span class="opt ${k === r[2] ? 'on' : ''}"><span>${o[0]}</span><b>${o[1] || ''}</b></span>`).join('')}</span></div>`).join('')}
      </div></div>
      ${step('Step 3 · Forks')}<span class="pg"></span></section>`);

    // 5. numbers
    const N = p.numbers; const mx = Math.max(...N.rows.map(r => r[4]));
    add(`<section class="slide">${mark(p)}
      <h2>${N.title}${N.sub ? `<small>${N.sub}</small>` : ''}</h2>
      <div class="body"><div class="bars">
        ${N.rows.map(r => `<div class="lbl"><span class="team">${r[0]}</span>${r[1]}<small>${r[2]}</small></div>
          <div><div class="bar ${r[5] ? 'hi' : ''}" style="width:${Math.max(3, 100 * r[4] / mx)}%"></div></div>
          <div class="val ${r[5] ? 'hi' : ''}">${r[3]}</div>`).join('')}
      </div></div>
      ${step('Step 4 · Why the numbers differ')}<span class="pg"></span></section>`);

    // 6. definition
    add(`<section class="slide">${mark(p)}
      <h2>The definition. Seven lines anyone can recompute.</h2>
      <div class="body"><div class="defwrap"><div class="defs">
        ${p.def.map((d, i) => `<div class="def"><span class="n">0${i + 1}</span><span class="k">${d[0]}</span><span class="v">${d[1]}<small>${d[2]}</small></span></div>`).join('')}
      </div>
      <div class="checklist" style="margin-top:0"><span class="hd">Checked against</span>
        ${p.concl.checks.map(c => `<div><span>${c[0]}</span><span>${c[1]}</span></div>`).join('')}
      </div></div></div>
      ${step('Step 5 · Definition')}<span class="pg"></span></section>`);

    // 7. answer
    const C = p.concl;
    add(`<section class="slide">${mark(p)}
      <h2>The answer.</h2>
      <div class="body"><div class="concl">
        <div>
          <div class="bignum"><span class="k">${C.k}</span><span class="v">${C.v}</span><span class="d">${C.d}</span></div>
          <div class="tell">${C.tell}</div>
        </div>
        <div class="limits"><span class="k">What this number does not prove</span>
          ${C.limits.map(l => `<p>${l}</p>`).join('')}
        </div>
      </div></div>
      ${step('Steps 6 and 7 · Check, conclude')}<span class="pg"></span></section>`);
  });

  addIf(wantClose, `<section class="slide">
    <h2>What the eight packs have in common.</h2>
    <div class="body"><div class="tiles">
      <div class="tile"><span class="n">01</span><b>Two tables, one truth<small>ids vs people; scan date vs actual; cost v1 vs v2; two helpdesks. The data never says which is right. The decision does.</small></b></div>
      <div class="tile"><span class="n">02</span><b>The window is a choice<small>Placed, delivered, requested, refunded. Pick the event that matches the decision and say which one you picked.</small></b></div>
      <div class="tile"><span class="n">03</span><b>Rates beat counts<small>Growth makes every count go up. Per order, per session, per delivered parcel is the fair comparison.</small></b></div>
      <div class="tile"><span class="n">04</span><b>Say what it does not prove<small>Not cash, not profit, not final, not the whole business. The limits are part of the number.</small></b></div>
    </div></div>
    <span class="pg"></span>
  </section>`);

  // Deck mechanics
  const slides = [...document.querySelectorAll('.slide')];
  slides.forEach((s, i) => { const p = s.querySelector('.pg'); if (p) p.textContent = String(i + 1).padStart(2, '0') + ' / ' + slides.length; });
  const startAt = parseInt(new URLSearchParams(location.search).get('s'), 10) || parseInt(location.hash.slice(1), 10) || 1;
  let index = Math.max(0, Math.min(slides.length - 1, startAt - 1));
  function fit() { stage.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080)); }
  function show(i) {
    index = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((el, k) => el.classList.toggle('active', k === index));
    try { history.replaceState(null, '', '#' + (index + 1)); } catch (e) {}
  }
  const HOME = './';
  if (ONLY) {
    const a = document.createElement('a'); a.className = 'home'; a.href = HOME; a.textContent = '← All packs';
    document.body.appendChild(a);
  }
  function next() { if (ONLY && index === slides.length - 1) { location.href = HOME; return; } show(index + 1); }
  addEventListener('resize', fit); fit(); show(index);
  document.querySelector('[data-prev]').addEventListener('click', () => show(index - 1));
  document.querySelector('[data-next]').addEventListener('click', next);
  addEventListener('keydown', e => {
    if (new URLSearchParams(location.search).has('static')) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(index - 1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length - 1);
    if (e.key === 'f') document.documentElement.requestFullscreen?.();
    if (e.key === 'Escape' && ONLY) location.href = HOME;
  });
</script>
</body>
</html>
