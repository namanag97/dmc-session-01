  .cover .block { background: var(--accent); height: 440px; }

  .flow { display: grid; gap: 14px; }

  .flow .node:last-child::after { content: ""; }
  .flow .node.back { border-top-color: var(--accent); }
  .flow .node time { display: block; font: 600 14px/1 var(--mono); color: var(--muted); }
  .flow .node b { display: block; margin-top: 12px; font-size: 26px; letter-spacing: -.02em; line-height: 1.05; }
  .flow .node.back b { color: var(--accent); }
  .states { margin-top: 56px; display: grid; gap: 24px; }

  .state .k { font: 600 14px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

      ${step('Step 5 · Definition')}<span class="pg"></span></section>`);
    // 6. conclusion
    const C = p.concl;
    add(`<section class="slide">${mark(p)}
      <h2>The answer, what we checked, and what it does not prove.</h2>
      <div class="body"><div class="concl">
        <div>
          <div class="bignum"><span class="k">${C.k}</span><span class="v">${C.v}</span><span class="d">${C.d}</span></div>
          <div class="checklist"><span class="hd">Checked against</span>
            ${C.checks.map(c => `<div><span>${c[0]}</span><span>${c[1]}</span></div>`).join('')}
          </div>
        </div>
        <div class="limits"><span class="k">What this number does not prove</span>
          ${C.limits.map(l => `<p>${l}</p>`).join('')}
        </div>
      </div></div>
      ${step('Steps 6 and 7 · Check, conclude')}<span class="pg"></span></section>`);
  });

  add(`<section class="slide">
    <h2>What the eight packs have in common.<small>Every wrong number in this room was a right number for a different question.</small></h2>
    <div class="body"><div class="tiles">
      <div class="tile"><span class="n">01</span><b>Two tables, one truth<small>ids vs people; scan date vs actual; cost v1 vs v2; two helpdesks. The data never says which is right. The decision does.</small></b></div>
      <div class="tile"><span class="n">02</span><b>The window is a choice<small>Placed, delivered, requested, refunded. Pick the event that matches the decision and say which one you picked.</small></b></div>
      <div class="tile"><span class="n">03</span><b>Rates beat counts<small>Growth makes every count go up. Per order, per session, per delivered parcel is the fair comparison.</small></b></div>
      <div class="tile"><span class="n">04</span><b>Say what it does not prove<small>Not cash, not profit, not final, not the whole business. The limits are part of the number.</small></b></div>
    </div></div>
    <span class="pg"></span>
  </section>`);

  // Deck mechanics
  const slides = [...document.querySelectorAll('.slide')];
  slides.forEach((s, i) => { const p = s.querySelector('.pg'); if (p) p.textContent = String(i + 1).padStart(2, '0') + ' / ' + slides.length; });
  const startAt = parseInt(new URLSearchParams(location.search).get('s'), 10) || parseInt(location.hash.slice(1), 10) || 1;
  let index = Math.max(0, Math.min(slides.length - 1, startAt - 1));
  function fit() { stage.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080)); }
  function show(i) {
    index = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((el, k) => el.classList.toggle('active', k === index));
    try { history.replaceState(null, '', '#' + (index + 1)); } catch (e) {}
  }
  addEventListener('resize', fit); fit(); show(index);
  document.querySelector('[data-prev]').addEventListener('click', () => show(index - 1));
  document.querySelector('[data-next]').addEventListener('click', () => show(index + 1));
  addEventListener('keydown', e => {
    if (new URLSearchParams(location.search).has('static')) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(index + 1); }
    if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(index - 1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length - 1);
    if (e.key === 'f') document.documentElement.requestFullscreen?.();
  });
</script>
</body>
</html>
